[project]
name = "depth-eval"
version = "0.1.0"
description = "Eval probing the depth of LLM instruction-following under mutating state"
requires-python = ">=3.10"
dependencies = ["sympy>=1.12", "python-dotenv>=1.0"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
extend-select = ["I"]
